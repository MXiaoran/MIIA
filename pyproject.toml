[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miia-repro"
version = "0.1.0"
description = "Reproduction of MIIA for cross-modal remote-sensing image-text retrieval"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.1,<2.5",
  "torchvision>=0.16,<0.20",
  "open_clip_torch==2.24.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "ImageHash>=4.3",
  "numpy>=1.24,<2",
  "requests>=2.31",
  "gdown>=5.1",
  "tqdm>=4.66",
  "attrs>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
include = ["miia*", "dall_e*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
